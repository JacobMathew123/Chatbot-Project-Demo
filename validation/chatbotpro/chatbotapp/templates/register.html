{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <div class="border p-5 rounded">
            <h1>Sign Up</h1>

            {% if messages %}
                {% for message in messages %}
                    <p style="color: red;">{{ message }}</p>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="text" name="username" placeholder="Enter your username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <input type="email" name="email" placeholder="Enter your email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="password" placeholder="Enter your password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="confirm_password" placeholder="Confirm your password" class="form-control" required>
                </div>
                <div>
                    <button type="submit" class="btn btn-outline-primary w-100 rounded-5">Register</button>
                </div>
            </form>
        </div>
        <p class="mt-3">Already have an account? <a href="{% url 'login_view' %}">Login</a></p>
    </div>
</body>
</html>
